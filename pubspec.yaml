name: flutter_learning
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  # UI Components
  flutter_svg: ^2.0.5          # SVG rendering
  cached_network_image: ^3.2.3  # Image caching
  carousel_slider: ^5.0.0       # Carousel for story list
  lottie: ^2.3.2                # Animation support
  flutter_screenutil: ^5.7.0    # Responsive UI
  cupertino_icons: ^1.0.2
  flutter_colorpicker: ^1.0.3   # Color picker for game config editor

  # State Management
  flutter_bloc: ^8.1.4          # BLoC pattern implementation
  equatable: ^2.0.5             # Value equality

  # Navigation
  go_router: ^14.8.1            # Declarative routing

  # Storage
  shared_preferences: ^2.1.0    # Local storage
  sqflite: ^2.2.8+4             # SQLite database
  path_provider: ^2.0.14        # File system access

  # Network
  dio: ^5.1.1                   # HTTP client
  connectivity_plus: ^3.0.3     # Network connectivity
  
  # Game Engine
  flame: ^1.25.0                 # 2D game engine
  flame_audio: ^2.11.0           # Audio support for games
  flame_spine: ^0.2.2+6          # Spine 2D animation support

  # Authentication
  # firebase_auth: ^4.4.2        # Phone authentication
  # firebase_core: ^2.10.0       # Firebase core
  
  # Analytics & Reporting
  fl_chart: ^0.62.0             # Charts for reports
  # firebase_analytics: ^10.2.1  # User analytics

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0                 # Internationalization
  
  # Utilities
  logger: ^1.3.0                # Logging
  permission_handler: ^10.2.0   # Permission management
  flutter_tts: ^3.6.3           # Text-to-speech
  dartz: ^0.10.1
  provider: ^6.1.2
  page_flip: ^0.2.1

  file_picker: ^5.0.0
  path: ^1.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  bloc_test: ^9.1.7             # BLoC testing
  mockito: ^5.4.5               # Mocking for tests
  flutter_lints: ^2.0.1         # Linting rules
  build_runner: ^2.4.15
  hive_generator: ^2.0.1

